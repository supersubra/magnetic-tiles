<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Magnetic Tile Builder</title>
<style>
:root{
  --r:#ff453a; --o:#ff9f0a; --y:#ffd60a; --g:#30d158; --b:#0a84ff; --p:#bf5af2; --k:#ff6fae; --t:#40c8e0;
  --ink:#1d2a44; --card:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Baloo 2",system-ui,sans-serif;
  color:var(--ink);background:#bfe8ff;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  background:linear-gradient(#bfe8ff,#e9f8ff 55%,#d7f5c9)}
.screen.on{display:flex}
.bar{display:flex;align-items:center;gap:10px;min-height:60px;flex:none}
.bar h1{flex:1;margin:0;text-align:center;font-size:clamp(22px,6vw,34px);font-weight:900;letter-spacing:.5px}
.round{width:56px;height:56px;border-radius:50%;background:#fff;font-size:26px;line-height:1;flex:none;
  box-shadow:0 4px 0 rgba(29,42,68,.18);display:grid;place-items:center}
.round:active,.big:active,.pm:active,.sizebtn:active,.card:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(29,42,68,.18)}
.round.ghost{visibility:hidden}
.lockrow{flex:none;display:flex;align-items:center;gap:10px;max-width:640px;width:calc(100% - 4px);margin:10px auto 6px;background:#fff;
  border-radius:20px;padding:8px 14px;font-weight:900;font-size:clamp(15px,4.4vw,20px);box-shadow:0 4px 0 rgba(29,42,68,.12)}
.lockrow span{flex:1}
.lockrow small{display:block;font-size:.72em;font-weight:700;opacity:.6}
.rows.fixed .pm{opacity:.25;pointer-events:none}
.lockrow input{position:absolute;opacity:0;width:1px;height:1px}
.lockrow i{width:66px;height:38px;border-radius:99px;background:#c5ccd8;position:relative;flex:none;transition:background .15s}
.lockrow i::after{content:"";position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:#fff;
  box-shadow:0 2px 3px rgba(0,0,0,.3);transition:transform .15s}
.lockrow input:checked+i{background:var(--g)}
.lockrow input:checked+i::after{transform:translateX(28px)}
.lockrow input:focus-visible+i{outline:3px solid var(--b)}
.sub{text-align:center;font-size:clamp(15px,4.2vw,20px);font-weight:700;opacity:.7;margin:0 0 8px}
.fill{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.big{flex:none;height:72px;border-radius:26px;background:var(--g);color:#fff;font-size:30px;font-weight:900;
  box-shadow:0 6px 0 #1e9c3f;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}

/* inventory */
.rows{display:grid;grid-template-columns:1fr;gap:8px;max-width:640px;margin:0 auto;width:100%;padding:0 2px}
@media (min-width:700px){.rows{grid-template-columns:1fr 1fr;max-width:900px}}
.namebox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:640px;margin:12px auto 6px;width:calc(100% - 4px);
  background:#fff7d6;border-radius:24px;padding:10px 14px;font-size:clamp(17px,4.8vw,22px);font-weight:900;box-shadow:0 4px 0 rgba(29,42,68,.12)}
.namebox span{flex:1;min-width:150px}
.namebox input{flex:1 1 180px;min-width:0;height:54px;border-radius:16px;border:3px solid var(--o);padding:0 14px;font:inherit;font-size:24px;
  color:var(--ink);background:#fff;user-select:text;-webkit-user-select:text;outline:none}
.namebox input:focus{border-color:var(--b)}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:22px;padding:6px 10px;
  box-shadow:0 4px 0 rgba(29,42,68,.12)}
.row svg{width:46px;height:46px;flex:none}
.row .nm{flex:1;min-width:0;font-weight:800;font-size:clamp(14px,4vw,20px);line-height:1.1}
.pm{width:50px;height:50px;border-radius:50%;font-size:36px;font-weight:900;line-height:1;color:#fff;flex:none;
  display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.pm.minus{background:var(--r)} .pm.plus{background:var(--g)}
.cnt{width:46px;text-align:center;font-size:32px;font-weight:900;flex:none}
.cnt.bump{animation:bump .18s}
@keyframes bump{50%{transform:scale(1.35)}}

/* size */
.sizes{display:flex;flex-direction:column;gap:14px;justify-content:center;max-width:640px;margin:0 auto;width:100%;height:100%}
.sizebtn{flex:1;max-height:200px;border-radius:30px;color:#fff;display:flex;align-items:center;gap:16px;padding:0 22px;
  font-size:clamp(28px,8vw,44px);font-weight:900;box-shadow:0 7px 0 rgba(0,0,0,.22);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.sizebtn svg{height:78%;max-height:130px;width:auto;flex:none}
.sizebtn span{flex:1;text-align:left}
.sizebtn:nth-child(1){background:var(--g)} .sizebtn:nth-child(2){background:var(--b)} .sizebtn:nth-child(3){background:var(--p)}

/* pick */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:820px;margin:0 auto;width:100%;padding-bottom:8px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border-radius:26px;padding:8px 8px 10px;position:relative;text-align:center;
  box-shadow:0 5px 0 rgba(29,42,68,.14);display:block;width:100%}
.card canvas{width:100%;aspect-ratio:1/1;display:block;border-radius:20px;background:linear-gradient(#e6f6ff,#f6fff0)}
.card .nm{font-size:clamp(18px,5vw,26px);font-weight:900;margin-top:4px}
.card .badge{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:var(--g);color:#fff;
  font-size:22px;font-weight:900;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.card.locked canvas{opacity:.35;filter:grayscale(1)}
.card.locked .nm{opacity:.45}
.card.locked .badge{background:var(--r)}
.card .star{position:absolute;top:10px;left:12px;font-size:30px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.card.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.miss{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:30px;margin-top:2px;font-weight:900;font-size:16px;color:#c0392b}
.miss span{display:inline-flex;align-items:center;gap:2px}
.miss svg{width:26px;height:26px}

/* need */
.needwrap{display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto;width:100%;height:100%}
#needCv{flex:1;min-height:120px;width:100%;border-radius:26px;background:#fff8;display:block}
.needlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;flex:none;padding:5px}
.need{background:var(--card);border-radius:22px;padding:6px 10px;display:flex;align-items:center;gap:6px;
  box-shadow:0 4px 0 rgba(29,42,68,.12);position:relative}
.need svg{width:48px;height:48px;flex:none}
.need b{font-size:clamp(24px,7vw,34px);font-weight:900;flex:1;white-space:nowrap}
.need i{font-style:normal;font-size:26px}
.need small{position:absolute;right:10px;bottom:2px;font-size:12px;font-weight:800;color:#c0392b}
.need.bad{outline:4px solid var(--o)}

/* step */
#step{background:linear-gradient(#cfeeff,#f2fbff 60%,#dff6d2)}
.dots{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px rgba(29,42,68,.25);transition:.2s}
.dots i.done{background:var(--g);box-shadow:none}
.dots i.now{background:var(--o);box-shadow:none;transform:scale(1.5)}
#stage{flex:1;min-height:0;width:100%;display:block;touch-action:none}
.say{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;border-radius:24px;
  padding:8px 14px;box-shadow:0 4px 0 rgba(29,42,68,.12);min-height:76px;max-width:640px;width:100%;margin:0 auto}
.chips{display:flex;gap:6px;flex:none;align-items:center}
.chips span{display:inline-flex;align-items:center;font-size:24px;font-weight:900}
.chips svg{width:50px;height:50px}
.say p{margin:0;font-size:clamp(17px,4.8vw,24px);font-weight:800;line-height:1.15}
.nav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px auto 0;max-width:640px;width:100%}
.arrow{width:92px;height:92px;border-radius:50%;font-size:46px;color:#fff;display:grid;place-items:center;line-height:1;flex:none}
.arrow:active{transform:translateY(4px)}
#prev{background:var(--b);box-shadow:0 7px 0 #0762bd}
#next{background:var(--g);box-shadow:0 7px 0 #1e9c3f;animation:nudge 1.6s infinite}
#prev[disabled]{opacity:.25}
@keyframes nudge{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.12)}}
#again{width:68px;height:68px;font-size:32px}
@media (orientation:landscape) and (max-height:520px){
  .arrow{width:68px;height:68px;font-size:34px} .say{min-height:56px} .chips svg{width:38px;height:38px}
  .bar{min-height:50px} .round{width:46px;height:46px;font-size:22px} .big{height:56px;font-size:24px}
  .sizes{flex-direction:row} .sizebtn{flex-direction:column;justify-content:center;padding:10px;max-height:none}
  .sizebtn span{text-align:center;flex:none} .sizebtn svg{height:50%}
  .needwrap{flex-direction:row} .needlist{width:46%;align-content:center}
}

/* done : graffiti wall */
#done{background:
  linear-gradient(rgba(20,16,30,.25),rgba(20,16,30,.55)),
  repeating-linear-gradient(0deg,transparent 0 44px,#3a2a26 44px 48px),
  repeating-linear-gradient(90deg,#9b4a3a 0 92px,#3a2a26 92px 96px);
  background-color:#9b4a3a;color:#fff;overflow:hidden}
.splat{position:absolute;border-radius:50%;filter:blur(14px);opacity:.75;pointer-events:none}
.graf{flex:none;text-align:center;font-family:"Marker Felt","Chalkboard SE","Comic Sans MS","Arial Rounded MT Bold",system-ui,sans-serif;
  font-weight:900;line-height:.95;margin-top:4px;position:relative;z-index:2}
.graf .ln{display:block;font-size:clamp(48px,17vw,120px);white-space:nowrap}
.graf .ln span{display:inline-block;position:relative;-webkit-text-stroke:3px #fff;paint-order:stroke fill;
  text-shadow:4px 4px 0 #111,8px 8px 0 rgba(0,0,0,.45);animation:pop .5s both cubic-bezier(.2,1.6,.4,1)}
.graf .ln span.drip::after{content:"";position:absolute;left:45%;top:82%;width:.09em;height:0;border-radius:0 0 1em 1em;
  background:currentColor;animation:drip 1.8s .9s forwards ease-out}
@keyframes drip{to{height:.55em}}
@keyframes pop{from{transform:scale(0) rotate(-40deg);opacity:0}}
.tag{display:inline-block;margin-top:10px;font-size:clamp(22px,6.5vw,40px);color:var(--y);transform:rotate(-4deg);
  text-shadow:2px 2px 0 #111;animation:pop .5s 1s both}
.pair{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:3cqw;position:relative;z-index:2;container-type:size;margin:6px 0}
.cell{width:min(47cqw,94cqh);aspect-ratio:1/1;flex:none;border-radius:22px;position:relative;overflow:hidden}
.cell:first-child{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.pic{background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.35);transform:rotate(3deg);container-type:size;display:grid;place-items:center;
  animation:pop .5s .5s both cubic-bezier(.2,1.6,.4,1)}
.pic span{font-size:68cqmin;line-height:1}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#doneCv{width:100%;height:100%;display:block}
.tag.new{display:block;width:max-content;margin:8px auto 0;color:#fff;background:var(--g);border-radius:99px;padding:4px 16px;
  font-size:clamp(16px,4.6vw,26px);text-shadow:none;transform:rotate(2deg);animation:pop .5s 1.4s both}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.donebtns{flex:none;display:flex;gap:12px;justify-content:center;position:relative;z-index:4}
.donebtns .big{flex:1;max-width:300px;margin:0}
.donebtns .big:first-child{background:var(--o);box-shadow:0 6px 0 #b86f00}
</style>
</head>
<body>

<!-- 1. inventory -->
<section class="screen on" id="inv">
  <div class="bar"><span class="round ghost"></span><h1>🧲 My Tiles</h1><button class="round mute" aria-label="Sound">🔊</button></div>
  <p class="sub">How many do you have?</p>
  <div class="fill">
    <div class="rows" id="rows"></div>
    <label class="namebox">✏️ <span>What is your name?</span>
      <input id="kidName" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Type your name">
    </label>
    <label class="lockrow"><span>🧩 Use my own tile counts<small id="ownHint"></small></span><input type="checkbox" id="ownSw" role="switch"><i></i></label>
    <label class="lockrow"><span>🔒 Open builds 3 at a time</span><input type="checkbox" id="lockSw" role="switch"><i></i></label>
  </div>
  <button class="big" id="invGo" aria-label="Next">Go ▶</button>
</section>

<!-- 2. size -->
<section class="screen" id="size">
  <div class="bar"><button class="round back" data-to="inv" aria-label="Back">◀</button><h1>How big?</h1><button class="round mute" aria-label="Sound">🔊</button></div>
  <div class="fill"><div class="sizes" id="sizes"></div></div>
</section>

<!-- 3. pick -->
<section class="screen" id="pick">
  <div class="bar"><button class="round back" data-to="size" aria-label="Back">◀</button><h1 id="pickTitle">Pick one!</h1><button class="round mute" aria-label="Sound">🔊</button></div>
  <div class="fill"><div class="grid" id="grid"></div></div>
</section>

<!-- 4. tiles needed -->
<section class="screen" id="need">
  <div class="bar"><button class="round back" data-to="pick" aria-label="Back">◀</button><h1 id="needTitle">You need</h1><button class="round mute" aria-label="Sound">🔊</button></div>
  <div class="fill"><div class="needwrap">
    <canvas id="needCv"></canvas>
    <div class="needlist" id="needList"></div>
  </div></div>
  <button class="big" id="needGo" aria-label="Start building">Let's build ▶</button>
</section>

<!-- 5. steps -->
<section class="screen" id="step">
  <div class="bar"><button class="round back" data-to="need" aria-label="Back">✕</button><div class="dots" id="dots"></div><button class="round mute" aria-label="Sound">🔊</button></div>
  <canvas id="stage"></canvas>
  <div class="say"><div class="chips" id="chips"></div><p id="sayText"></p></div>
  <div class="nav">
    <button class="arrow" id="prev" aria-label="Back one step">◀</button>
    <button class="round" id="again" aria-label="Show again">↻</button>
    <button class="arrow" id="next" aria-label="Next step">▶</button>
  </div>
</section>

<!-- 6. celebration -->
<section class="screen" id="done">
  <div class="graf" id="graf"></div>
  <div class="pair">
    <div class="cell"><canvas id="doneCv"></canvas></div>
    <div class="cell pic" id="donePic"></div>
  </div>
  <div class="donebtns">
    <button class="big" id="doneAgain">↻ Again</button>
    <button class="big" id="doneMore">More ▶</button>
  </div>
  <canvas id="confetti"></canvas>
</section>

<script>
'use strict';
/* ============================================================
   Settings
   ============================================================ */
const SWIPE_RIGHT_IS_NEXT = true;      // swipe finger to the right = next step
const COL = {r:'#ff453a',o:'#ff9f0a',y:'#ffd60a',g:'#30d158',b:'#0a84ff',p:'#bf5af2',k:'#ff6fae',t:'#40c8e0'};
const SHAPES = [
  {id:'sq',   name:'Square',                col:'r', def:28},
  {id:'win',  name:'Window / door',         col:'t', def:12},
  {id:'iso',  name:'Tall triangle',         col:'p', def:10},
  {id:'siso', name:'Short pointy triangle', col:'k', def:16},
  {id:'eq',   name:'Triangle',              col:'g', def:27},
  {id:'rect', name:'Rectangle',             col:'y', def:4},
  {id:'bsq',  name:'Big square',            col:'b', def:4},
  {id:'rt',   name:'Corner triangle',       col:'o', def:16},
  {id:'wh',   name:'Wheel base',            col:'o', def:1}
];
// a window / door tile is the same size as a square, so it can stand in for one
const have=id=>id==='sq'?inv.sq+inv.win:inv[id];
const CHEERS = [
  ['HOORAY','You have done it!'],      ['WELL DONE','What a builder!'],
  ['SUPER','That looks amazing!'],     ['WOW','You built it all!'],
  ['BRAVO','Great building!'],         ['AWESOME','You are a star!'],
  ['YOU ROCK','High five!'],           ['FANTASTIC','You did every step!'],
  ['GREAT JOB','Clever hands!'],       ['TA-DA','Look what you made!'],
  ['BRILLIANT','Top builder!'],        ['YIPPEE','You finished it!']
];
const SIZES = [{id:'small',name:'Small'},{id:'medium',name:'Medium'},{id:'large',name:'Big'}];

/* ============================================================
   Tile geometry helpers  (1 unit = one tile edge, y is up)
   ============================================================ */
const h = Math.sqrt(3)/2;        // height of the small triangle
const P = Math.SQRT1_2;          // height of a 4-triangle pyramid
const SP = Math.sqrt(3.5);       // height of a 4-tall-triangle spire
const IH = Math.sqrt(3.75);      // height of the tall triangle itself
const H = 0.35;                  // height of the wheel base deck
const X=[1,0,0], Y=[0,1,0], Z=[0,0,1], NX=[-1,0,0], NY=[0,-1,0], NZ=[0,0,-1];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];

const sq  =(o,u,v,c)=>({s:'sq',c,v:[o,add(o,u),add(add(o,u),v),add(o,v)]});
const wz  =(x,y,z,c)=>sq([x,y,z],X,Y,c);          // wall facing front/back
const wx  =(x,y,z,c)=>sq([x,y,z],Z,Y,c);          // wall facing left/right
const fl  =(x,y,z,c)=>sq([x,y,z],X,Z,c);          // flat (floor / roof)
const eq  =(a,u,w,c)=>({s:'eq', c,v:[a,add(a,u),add(add(a,mul(u,.5)),mul(w,h))]});
const iso =(a,u,w,c)=>({s:'iso',c,v:[a,add(a,u),add(add(a,mul(u,.5)),mul(w,IH))]});
const rt  =(a,u,v,c)=>({s:'rt', c,v:[a,add(a,u),add(a,v)]});
// four triangles leaning together over a flat square: [back, right, front, left]
function pyr(x,y,z,cols,s){
  const A=[x+.5,y+(s==='iso'?SP:P),z+.5], q=[[x,y,z],[x+1,y,z],[x+1,y,z+1],[x,y,z+1]];
  return q.map((p,i)=>({s:s||'eq',c:cols[i%cols.length],v:[p,q[(i+1)%4],A]}));
}
// four triangles making a nose on a wall, pointing to +x: [bottom, back, top, front]
function nose(x,y,z,cols,dir){
  const A=[x+(dir||1)*P,y+.5,z+.5], q=[[x,y,z],[x,y,z+1],[x,y+1,z+1],[x,y+1,z]];
  const t=q.map((p,i)=>({s:'eq',c:cols[i%cols.length],v:[p,q[(i+1)%4],A]}));
  return [t[0],t[3],t[2],t[1]];
}
function wheel(x,z,c){
  const t={s:'wh',c,v:[[x,H,z],[x+2,H,z],[x+2,H,z+1],[x,H,z+1]],extra:[]};
  for(const wxp of [x+.32,x+1.68]) for(const wzp of [z-.1,z+1.1]){
    const disc=[],hub=[];
    for(let i=0;i<16;i++){const a=i/16*Math.PI*2;
      disc.push([wxp+.27*Math.cos(a),.27+.27*Math.sin(a),wzp]);
      hub.push([wxp+.1*Math.cos(a),.27+.1*Math.sin(a),wzp+(wzp<z?-.01:.01)]);}
    t.extra.push({v:disc,fill:'#2b2f3a'},{v:hub,fill:'#d9dde6'});
  }
  // the line where the two squares join
  t.extra.push({v:[[x+.97,H+.004,z+.06],[x+1.03,H+.004,z+.06],[x+1.03,H+.004,z+.94],[x+.97,H+.004,z+.94]],fill:'#ffffff'});
  return t;
}
const st=(say,...tiles)=>({say,tiles:tiles.flat()});
// four walls making a box
const box=(x,y,a,b)=>[wz(x,y,0,a),wx(x,y,0,b),wx(x+1,y,0,b),wz(x,y,1,a)];
// direction for a tall triangle that leans from one tile high down to the floor
const LEAN=Math.sqrt(1-1/3.75), DOWN_BACK=[-LEAN,-1/IH,0], DOWN_FRONT=[LEAN,-1/IH,0];

/* ============================================================
   The builds.  Rules that keep them standing with real tiles:
   - anything that stands on the floor is a closed box, or is joined to a floor tile

   ============================================================ */

/* The order builds appear in. Every row of three is one group: two things and one animal.
   A group opens only when every build in the group before it has been finished. */
const ORDER = {
  small: ['tent','house','fish',  'tree','boat','turtle',  'car','crown','bird',  'bridge','gift','bunny'],
  medium:['rocket','tower','dog',  'ship','barn','crocodile',  'train','bus','elephant',  'helicopter','truck','whale'],
  large: ['airplane','robot','giraffe',  'castle','skyscraper','caterpillar',  'church','pirate','dinosaur',  'submarine','factory','unicorn']
};
const GROUP = 3;

/* pre-compute everything the renderer needs */
function prep(m){
  m.tiles=[]; m.need={sq:0,eq:0,rt:0,iso:0,wh:0};
  let mn=[1e9,0,1e9], mx=[-1e9,-1e9,-1e9];
  m.steps.forEach((s,si)=>s.tiles.forEach((t,ti)=>{
    t.step=si; t.idx=ti; m.need[t.s]++; m.tiles.push(t);
    t.polys=[{v:t.v,fill:COL[t.c],main:true},...(t.extra||[])];
    t.polys.forEach(p=>{
      p.v.forEach(q=>{for(let i=0;i<3;i++){mn[i]=Math.min(mn[i],q[i]);mx[i]=Math.max(mx[i],q[i]);}});
      const a=p.v[0],b=p.v[1],c=p.v[2];
      const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], w=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
      let n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]];
      const l=Math.hypot(...n)||1; n=n.map(k=>k/l);
      p.sh=.78+.32*Math.abs(n[0]*.35+n[1]*.8+n[2]*.48);
      const rgb=p.fill.match(/\w\w/g).map(k=>parseInt(k,16));
      p.rgb=rgb.map(k=>Math.min(255,Math.round(k*p.sh)));
      p.dark=rgb.map(k=>Math.round(k*.55));
    });
    t.cen=t.v.reduce((s,q)=>add(s,q),[0,0,0]).map(k=>k/t.v.length);
  }));
  m.c=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2];
  m.rad=0; m.grad=0;
  m.tiles.forEach(t=>t.polys.forEach(p=>p.v.forEach(q=>{
    m.rad=Math.max(m.rad,Math.hypot(q[0]-m.c[0],q[1]-m.c[1],q[2]-m.c[2]));
    m.grad=Math.max(m.grad,Math.hypot(q[0]-m.c[0],q[2]-m.c[2]));})));
  m.tiles.forEach(t=>{
    const d=[t.cen[0]-m.c[0],t.cen[1]-m.c[1]+m.rad*.9,t.cen[2]-m.c[2]], l=Math.hypot(...d)||1;
    t.dir=d.map(k=>k/l);
  });
  m.count=m.tiles.length;
}
MODELS.forEach(prep);

/* ============================================================
   Tiny 3D renderer (see-through tiles, painter's algorithm)
   ============================================================ */
function render(cv,m,o){
  const d=Math.min(window.devicePixelRatio||1,2), r=cv.getBoundingClientRect();
  const W=r.width, Hh=r.height; if(W<2||Hh<2) return;
  const pw=Math.round(W*d), ph=Math.round(Hh*d);
  if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph;}
  const g=cv.getContext('2d'); g.setTransform(d,0,0,d,0,0); g.clearRect(0,0,W,Hh);
  const pitch=o.pitch==null?.48:o.pitch;
  const cy=Math.cos(o.yaw), sy=Math.sin(o.yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  const S=Math.min(W,Hh)*.47/m.rad, D=m.rad*7;
  const proj=p=>{
    const x=p[0]-m.c[0], y=p[1]-m.c[1], z=p[2]-m.c[2];
    const x1=x*cy+z*sy, z1=-x*sy+z*cy, y2=y*cp-z1*sp, z2=y*sp+z1*cp, k=D/(D-z2);
    return [W/2+x1*S*k, Hh*.5-y2*S*k, z2];
  };
  // ground
  g.beginPath();
  for(let i=0;i<=40;i++){const a=i/40*Math.PI*2, q=proj([m.c[0]+Math.cos(a)*m.grad*1.12,0,m.c[2]+Math.sin(a)*m.grad*1.12]);
    i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);}
  g.fillStyle=o.ground||'rgba(60,140,70,.16)'; g.fill();

  const items=[];
  for(const t of m.tiles){
    if(t.step>o.upto) continue;
    let off=null, alpha=1, hl=0, flash=0;
    if(t.step===o.upto && o.anim!=null){
      const tt=(o.now-o.anim-t.idx*420)/760;
      if(tt<=0) continue;
      if(tt<1){const e=1-Math.pow(1-tt,3); off=mul(t.dir,(1-e)*m.rad*1.7); alpha=Math.min(1,tt*2.5);}
      else{ if(t.landed!==o.anim){t.landed=o.anim; o.onLand&&o.onLand(t);} flash=Math.max(0,1-(tt-1)*2); }
      hl=1;
    }
    for(const p of t.polys){
      const pts=p.v.map(q=>proj(off?add(q,off):q));
      items.push({p,pts,z:pts.reduce((s,q)=>s+q[2],0)/pts.length,alpha,hl:hl&&p.main,flash});
    }
  }
  items.sort((a,b)=>a.z-b.z);
  const lw=Math.max(1.5,S*.045);
  g.lineJoin='round';
  for(const it of items){
    const {p,pts}=it;
    g.globalAlpha=it.alpha;
    g.beginPath(); pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])); g.closePath();
    if(p.main){
      g.fillStyle=`rgba(${p.rgb[0]},${p.rgb[1]},${p.rgb[2]},.68)`; g.fill();
      g.strokeStyle=`rgb(${p.dark[0]},${p.dark[1]},${p.dark[2]})`; g.lineWidth=lw; g.stroke();
      // inner frame, like a real magnetic tile
      const cx=pts.reduce((s,q)=>s+q[0],0)/pts.length, cyy=pts.reduce((s,q)=>s+q[1],0)/pts.length;
      g.beginPath(); pts.forEach((q,i)=>{const x=cx+(q[0]-cx)*.72,y=cyy+(q[1]-cyy)*.72; i?g.lineTo(x,y):g.moveTo(x,y);}); g.closePath();
      g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=lw*.5; g.stroke();
      if(it.hl){
        const pulse=.55+.45*Math.sin(o.now/170);
        g.beginPath(); pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])); g.closePath();
        g.shadowColor='#fff'; g.shadowBlur=14+it.flash*26;
        g.strokeStyle=`rgba(255,255,255,${.55+.45*pulse})`; g.lineWidth=lw*(1.1+.5*pulse+it.flash*2); g.stroke();
        g.shadowBlur=0;
        if(it.flash>0){g.fillStyle=`rgba(255,255,255,${it.flash*.6})`; g.fill();}
      }
    }else{
      g.fillStyle=p.fill; g.fill();
    }
  }
  g.globalAlpha=1;
}

/* ============================================================

   ============================================================ */
function icon(s,c){
  const f=COL[c]||c, a=`fill="${f}" fill-opacity=".8" stroke="${f}" stroke-width="5" stroke-linejoin="round"`;
  const b=`fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" stroke-linejoin="round"`;
  const body={
    sq:`<rect x="9" y="9" width="46" height="46" rx="4" ${a}/><rect x="18" y="18" width="28" height="28" rx="2" ${b}/>`,
    eq:`<polygon points="32,10 56,52 8,52" ${a}/><polygon points="32,24 45,46 19,46" ${b}/>`,
    rt:`<polygon points="10,10 10,54 54,54" ${a}/><polygon points="17,27 17,47 37,47" ${b}/>`,
    iso:`<polygon points="32,5 45,59 19,59" ${a}/><polygon points="32,24 39,53 25,53" ${b}/>`,
    win:`<rect x="9" y="9" width="46" height="46" rx="4" ${a}/><path d="M32 13V51M13 32H51" stroke="#fff" stroke-opacity=".85" stroke-width="4"/>`,
    siso:`<polygon points="32,14 48,56 16,56" ${a}/><polygon points="32,30 40,50 24,50" ${b}/>`,
    rect:`<rect x="19" y="6" width="26" height="52" rx="4" ${a}/><rect x="25" y="13" width="14" height="38" rx="2" ${b}/>`,
    bsq:`<rect x="5" y="5" width="54" height="54" rx="4" ${a}/><path d="M32 9V55M9 32H55" ${b}/>`,
    wh:`<rect x="4" y="18" width="56" height="20" rx="4" ${a}/><path d="M32 18V38" stroke="#fff" stroke-opacity=".85" stroke-width="3"/><circle cx="15" cy="46" r="9" fill="#2b2f3a"/><circle cx="49" cy="46" r="9" fill="#2b2f3a"/><circle cx="15" cy="46" r="3.5" fill="#d9dde6"/><circle cx="49" cy="46" r="3.5" fill="#d9dde6"/>`
  }[s];
  return `<svg viewBox="0 0 64 64" aria-hidden="true">${body}</svg>`;
}
function stackIcon(n){
  const cols=['#fff','#ffe98a','#ffd0e4'], cells=[[[0,0]],[[0,0],[1,0],[.5,1]],[[0,0],[1,0],[2,0],[.5,1],[1.5,1],[1,2]]][n];
  const s=30, w=[1,2,3][n]*s+8, hh=[1,2,3][n]*s+8;
  return `<svg viewBox="0 0 ${w} ${hh}">`+cells.map(([x,y],i)=>
    `<rect x="${4+x*s+2}" y="${hh-4-(y+1)*s+2}" width="${s-4}" height="${s-4}" rx="5" fill="${cols[i%3]}" fill-opacity=".9" stroke="rgba(0,0,0,.25)" stroke-width="2"/>`).join('')+`</svg>`;
}

/* ============================================================
   Sound + voice
   ============================================================ */
const store={
  get(k,d){try{const v=localStorage.getItem('mt_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('mt_'+k,JSON.stringify(v));}catch(e){}}
};
let muted=store.get('muted',false), actx=null;
function tone(f,t0,dur,type,vol){
  if(muted) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+t0;
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*1.5,t+dur);
    g.gain.setValueAtTime(vol||.18,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const snap=()=>tone(520,0,.12,'triangle',.25);
const click=()=>tone(700,0,.05,'sine',.1);
const fanfare=()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.14,.22,'triangle',.22));
function speak(txt){
  if(muted||!('speechSynthesis' in window)) return;
  try{speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt); u.rate=.9; u.pitch=1.15; speechSynthesis.speak(u);}catch(e){}
}
function hush(){try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}}
function paintMute(){document.querySelectorAll('.mute').forEach(b=>b.textContent=muted?'🔇':'🔊');}
document.querySelectorAll('.mute').forEach(b=>b.onclick=()=>{muted=!muted;store.set('muted',muted);paintMute();if(muted)hush();else click();});
paintMute();

  screen=id; hush();

}

let finished=new Set(store.get('done',[])), lockOn=store.get('lock',false);
// how many builds of this size can be played right now
function unlocked(sz){
  const ids=ORDER[sz]; if(!lockOn) return ids.length;
  let g=0; while((g+1)*GROUP<=ids.length && ids.slice(g*GROUP,(g+1)*GROUP).every(id=>finished.has(id))) g++;
  return Math.min(ids.length,(g+1)*GROUP);
}
const missing=m=>SHAPES.map(s=>({s,n:Math.max(0,(m.need[s.id]||0)-have(s.id))})).filter(x=>x.n>0);

/* ---- 1. inventory ---- */
function buildInv(){
  $('rows').innerHTML=SHAPES.map(s=>`<div class="row">${icon(s.id,s.col)}<div class="nm">${s.name}</div>
    <button class="pm minus" data-s="${s.id}" data-d="-1" aria-label="Fewer ${s.name}">−</button>
    <div class="cnt" id="cnt_${s.id}">${inv[s.id]}</div>
    <button class="pm plus" data-s="${s.id}" data-d="1" aria-label="More ${s.name}">+</button></div>`).join('');
  $('rows').querySelectorAll('.pm').forEach(b=>{
    let timer=null, rep=null;
    const bump=()=>{
      const k=b.dataset.s, v=Math.max(0,Math.min(99,inv[k]+ +b.dataset.d));
      if(!useOwn||v===inv[k]) return; inv[k]=own[k]=v; store.set('inv3',own);
      const el=$('cnt_'+k); el.textContent=v; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); click();
    };
    const stop=()=>{clearTimeout(timer);clearInterval(rep);timer=rep=null;};
    b.addEventListener('pointerdown',e=>{e.preventDefault();bump();stop();timer=setTimeout(()=>rep=setInterval(bump,90),420);});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  });
}

$('kidName').addEventListener('input',e=>{kid=e.target.value.replace(/[^\p{L}\p{N} '-]/gu,'').trim().slice(0,12);store.set('kid',kid);});

/* ---- 2. size ---- */
$('sizes').innerHTML=SIZES.map((s,i)=>`<button class="sizebtn" data-size="${s.id}">${stackIcon(i)}<span>${s.name}</span></button>`).join('');
$('sizes').querySelectorAll('.sizebtn').forEach(b=>b.onclick=()=>{click();size=b.dataset.size;buildPick();show('pick');});

/* ---- 3. pick ---- */
function buildPick(){
  const list=ORDER[size].map(id=>MODELS.find(m=>m.id===id)), open=unlocked(size);
  $('grid').innerHTML=list.map((m,i)=>{
    const ms=missing(m), lock=i>=open;
    return `<button class="card ${lock?'locked':''}" data-id="${m.id}" aria-label="${m.name}${lock?' (locked)':''}">
      <canvas></canvas><div class="badge">${lock?'✕':'✓'}</div>${finished.has(m.id)?'<div class="star">⭐</div>':''}
      <div class="nm">${m.emoji} ${m.name}</div>
      <div class="miss">${lock?'':ms.map(x=>`<span>+${x.n}${icon(x.s.id,x.s.col)}</span>`).join('')}</div></button>`;
  }).join('');
  previews=[];
  $('grid').querySelectorAll('.card').forEach((c,i)=>{
    const m=MODELS.find(x=>x.id===c.dataset.id);
    previews.push({cv:c.querySelector('canvas'),m,ph:i*.9});
    c.onclick=()=>{
      if(i>=open){
        tone(180,0,.18,'square',.12); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
        speak('Finish the ones with a green tick first.'); return;
      }
      click();model=m;buildNeed();show('need');speak(m.name);
    };
  });
}
function paintOwn(){
  Object.assign(inv,useOwn?own:DEFAULTS);
  SHAPES.forEach(s=>{const el=$('cnt_'+s.id); if(el) el.textContent=inv[s.id];});
  $('rows').classList.toggle('fixed',!useOwn);
  $('ownSw').checked=useOwn;
  $('ownHint').textContent=useOwn?'On: your saved counts. Change them with − and +.':'Off: the default tile set.';
}
$('ownSw').onchange=e=>{useOwn=e.target.checked;store.set('own',useOwn);click();paintOwn();};
$('lockSw').checked=lockOn;
$('lockSw').onchange=e=>{lockOn=e.target.checked;store.set('lock',lockOn);click();};

/* ---- 4. tiles needed ---- */
function buildNeed(){
  $('needTitle').textContent=model.emoji+' '+model.name;
  $('needList').innerHTML=SHAPES.filter(s=>model.need[s.id]).map(s=>{
    const n=model.need[s.id], lack=Math.max(0,n-have(s.id));
    return `<div class="need ${lack?'bad':''}">${icon(s.id,s.col)}<b>× ${n}</b><i>${lack?'⚠️':'✅'}</i>${lack?`<small>${lack} more</small>`:''}</div>`;
  }).join('');
}
$('needGo').onclick=()=>{click();startBuild();};

/* ---- 5. steps ---- */
function startBuild(){ show('step'); goStep(0); }
function goStep(i){
  stepI=i; animT=performance.now()+150; spin=0;
  const s=model.steps[i];
  $('dots').innerHTML=model.steps.map((_,k)=>`<i class="${k<i?'done':k===i?'now':''}"></i>`).join('');
  const groups={};
  s.tiles.forEach(t=>{const k=t.s+'|'+t.c;groups[k]=(groups[k]||0)+1;});
  $('chips').innerHTML=Object.entries(groups).map(([k,n])=>{const [sh,c]=k.split('|');return `<span>${n>1?n+'×':''}${icon(sh,c)}</span>`;}).join('');
  $('sayText').textContent=s.say;
  $('prev').disabled=i===0;
  $('next').textContent=i===model.steps.length-1?'🎉':'▶';
  speak(s.say);
}
function nextStep(){ click(); if(stepI<model.steps.length-1) goStep(stepI+1); else finish(); }
function prevStep(){ if(stepI>0){click();goStep(stepI-1);} }
$('next').onclick=nextStep; $('prev').onclick=prevStep;
$('again').onclick=()=>{click();animT=performance.now();speak(model.steps[stepI].say);};

// swipe on the step screen; a plain tap on the model spins it round once
(()=>{
  let sx=0, sy=0, t0=0, on=false, onStage=false;
  const el=$('step');
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')){on=false;return;}
    on=true; sx=e.clientX; sy=e.clientY; t0=performance.now(); onStage=e.target.id==='stage';
  });
  el.addEventListener('pointerup',e=>{
    if(!on) return; on=false;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.3){
      const fwd=(dx>0)===SWIPE_RIGHT_IS_NEXT; fwd?nextStep():prevStep();
    }else if(onStage && Math.hypot(dx,dy)<12 && performance.now()-t0<400){
      spin=performance.now();
    }
  });
  el.addEventListener('pointercancel',()=>on=false);
})();
document.addEventListener('keydown',e=>{
  if(screen!=='step') return;
  if(e.key==='ArrowRight') nextStep(); else if(e.key==='ArrowLeft') prevStep();
});

/* ---- 6. celebration ---- */
let parts=[], doneT=0;
function finish(){
  const before=unlocked(model.size);
  finished.add(model.id); store.set('done',[...finished]);
  const opened=unlocked(model.size)>before;
  show('done'); doneT=performance.now();
  // the real thing, next to the tile model. A photo at images/<id>.jpg is used when there is one.
  $('donePic').innerHTML=`<span>${model.emoji}</span><img alt="${model.name}" src="images/${model.id}.jpg" onerror="this.remove()">`;
  // a different cheer every time, in turn
  const turn=store.get('cheer',0), [cheer,extra]=CHEERS[turn%CHEERS.length]; store.set('cheer',turn+1);
  const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const cols=Object.values(COL), lines=kid?[cheer,kid.toUpperCase()+'!']:[cheer+'!','YOU DID IT!'];
  const fs=Math.min(17,84/(Math.max(...lines.map(l=>l.length))*.8));
  let k=0;
  $('graf').innerHTML=lines.map(l=>`<span class="ln" style="font-size:clamp(30px,${fs.toFixed(1)}vw,120px)">${[...l].map(ch=>{
    if(ch===' ') return '&nbsp;';
    const c=cols[(k*3+1)%cols.length], rot=((k*37)%17)-8, d=k*.07; k++;
    return `<span class="${k%3===0?'drip':''}" style="color:${c};transform:rotate(${rot}deg);animation-delay:${d}s">${esc(ch)}</span>`;
  }).join('')}</span>`).join('')+`<span class="tag">★ ${extra} ★</span>`+(opened?`<span class="tag new">🔓 New ones to build!</span>`:'');
  document.querySelectorAll('#done .splat').forEach(s=>s.remove());
  for(let i=0;i<7;i++){
    const s=document.createElement('div'); s.className='splat';
    const w=80+((i*53)%120);
    s.style.cssText=`width:${w}px;height:${w}px;left:${(i*29+5)%90}%;top:${(i*41+8)%85}%;background:${cols[i%cols.length]}`;
    $('done').prepend(s);
  }
  parts=[]; burst(140);
  fanfare(); setTimeout(()=>speak(cheer+(kid?', '+kid:'')+'! '+extra+' You built a '+model.name+'!'+(opened?' You opened new ones to build!':'')),700);
}
function burst(n){
  const cols=Object.values(COL);
  for(let i=0;i<n;i++) parts.push({x:Math.random(),y:-.1-Math.random()*.6,vx:(Math.random()-.5)*.25,vy:.25+Math.random()*.35,
    r:Math.random()*6.28,vr:(Math.random()-.5)*8,s:7+Math.random()*9,c:cols[i%cols.length],star:i%5===0});
}
function drawConfetti(dt){
  const cv=$('confetti'), d=Math.min(window.devicePixelRatio||1,2), W=cv.clientWidth, Hh=cv.clientHeight;
  if(cv.width!==Math.round(W*d)||cv.height!==Math.round(Hh*d)){cv.width=Math.round(W*d);cv.height=Math.round(Hh*d);}
  const g=cv.getContext('2d'); g.setTransform(d,0,0,d,0,0); g.clearRect(0,0,W,Hh);
  for(const p of parts){
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt; p.x+=Math.sin(p.r)*.0015;
    if(p.y>1.1){p.y=-.1;p.x=Math.random();}
    g.save(); g.translate(p.x*W,p.y*Hh); g.rotate(p.r); g.fillStyle=p.c;
    if(p.star){g.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5,rr=i%2?p.s*.45:p.s;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}g.closePath();g.fill();}
    else g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2*Math.abs(Math.cos(p.r*1.3))+2);
    g.restore();
  }
}
$('doneAgain').onclick=()=>{click();startBuild();};
$('doneMore').onclick=()=>{click();buildPick();show('pick');};

/* ============================================================
   One animation loop for whatever is on screen
   ============================================================ */
let last=performance.now();
function tick(now){
  const dt=Math.min(.25,(now-last)/1000); last=now;
  if(screen==='pick'){
    for(const p of previews) render(p.cv,p.m,{yaw:now/2600+p.ph,upto:99,now});
  }else if(screen==='need'){
    render($('needCv'),model,{yaw:now/2400,upto:99,now});
  }else if(screen==='step'){
    let extra=0;
    if(spin){const k=(now-spin)/2600; if(k>=1) spin=0; else extra=(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2)*Math.PI*2;}
    render($('stage'),model,{yaw:-.62+.42*Math.sin(now/2300)+extra,upto:stepI,anim:animT,now,onLand:snap});
  }else if(screen==='done'){
    render($('doneCv'),model,{yaw:(now-doneT)/1400,upto:99,now,ground:'rgba(255,255,255,.14)'});
    drawConfetti(dt);
  }
  requestAnimationFrame(tick);
}

/* ============================================================
   Self-check (run validateModels() in the console)
   ============================================================ */
window.validateModels=function(){
  const want={sq:[1,1,1,1],wh:[1,1,2,2],eq:[1,1,1],rt:[1,1,Math.SQRT2],iso:[1,2,2]}, errs=[], notes=[];
  const E=1e-6, sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
    cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], len=a=>Math.hypot(...a);
  const edges=t=>t.v.map((p,k)=>[p,t.v[(k+1)%t.v.length]]);
  const norm=t=>{const n=cross(sub(t.v[1],t.v[0]),sub(t.v[2],t.v[0])),l=len(n);return n.map(k=>k/l);};
  const onSeg=(p,a,b)=>{const ab=sub(b,a),ap=sub(p,a),k=dot(ap,ab)/dot(ab,ab);return k>-E&&k<1+E&&len(cross(ab,ap))<1e-4;};
  const onBase=(p,w)=>Math.abs(p[1]-H)<E&&p[0]>w.v[0][0]-E&&p[0]<w.v[1][0]+E&&p[2]>w.v[0][2]-E&&p[2]<w.v[3][2]+E;
  // does edge e of one tile sit along tile B?
  const joins=(e,B)=>(B.s==='wh'&&onBase(e[0],B)&&onBase(e[1],B))||edges(B).some(f=>
    (onSeg(e[0],f[0],f[1])&&onSeg(e[1],f[0],f[1]))||(onSeg(f[0],e[0],e[1])&&onSeg(f[1],e[0],e[1])));
  const onFloor=e=>Math.abs(e[0][1])<E&&Math.abs(e[1][1])<E;
  const level=t=>t.v.every(p=>Math.abs(p[1]-t.v[0][1])<E);
  MODELS.forEach(m=>{
    const seen=new Set();
    m.tiles.forEach((t,i)=>{
      const tag=`${m.id} step ${t.step+1} (${t.s})`;
      // --- is it a real tile shape? ---
      const e=t.v.map((p,k)=>{const q=t.v[(k+1)%t.v.length];return Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]);}).sort((a,b)=>a-b);
      if(e.length!==want[t.s].length||e.some((x,k)=>Math.abs(x-want[t.s][k])>1e-6)) errs.push(`${tag} edges ${e.map(x=>x.toFixed(3))}`);
      if(t.s==='sq'){const dg=Math.hypot(...sub(t.v[0],t.v[2]));if(Math.abs(dg-Math.SQRT2)>1e-6) errs.push(`${tag} not square`);}
      const key=t.v.map(p=>p.map(x=>x.toFixed(3)).join(',')).sort().join('|');
      if(seen.has(key)) errs.push(`${tag} duplicate`); seen.add(key);
      if(!COL[t.c]) errs.push(`${tag} bad colour ${t.c}`);
      if(t.v.some(p=>p[1]<-1e-9)) errs.push(`${tag} below the floor`);
      if(t.v.some(p=>p[1]>6)) errs.push(`${tag} too tall`);
      // --- will it stand up? ---
      if(t.s==='wh'||t.rest) return;
      const es=edges(t), others=m.tiles.filter(o=>o!==t&&!o.rest);
      const held=es.filter(x=>onFloor(x)||others.some(o=>joins(x,o))).length;
      const heldNow=es.some(x=>onFloor(x)||others.some(o=>o.step<=t.step&&joins(x,o)));
      if(!heldNow) errs.push(`${tag} has nothing to hold on to when it is placed`);
      if(level(t)){ if(t.v[0][1]>E&&held<2) errs.push(`${tag} flat tile hangs by one edge`); return; }
      if(t.v.length===4&&held<2) errs.push(`${tag} square stands on one edge`);
      if(t.v.length===3&&held<2) notes.push(`${m.id}: ${t.s} triangle held by one edge (step ${t.step+1})`);
      if(t.v.length===4&&es.some(onFloor)){
        const n=norm(t), g=es.filter(onFloor), up=es.filter(x=>!onFloor(x));
        const onTile=others.some(o=>level(o)&&g.some(x=>joins(x,o)));
        const corner=others.some(o=>!level(o)&&edges(o).some(onFloor)&&Math.abs(dot(norm(o),n))<.99&&up.some(x=>joins(x,o)));
        if(!onTile&&!corner) errs.push(`${tag} wall stands alone on the floor`);
      }
    });
  });
  return {errors:errs,notes,models:MODELS.map(m=>({id:m.id,size:m.size,steps:m.steps.length,tiles:m.count,need:m.need}))};
};

buildInv();
paintOwn();
requestAnimationFrame(tick);
</script>
</body>
